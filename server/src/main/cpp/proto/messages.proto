syntax = "proto3";

package qsc.proto;

// Envelope wrapping all message types. Use oneof for routing.
message WsMessage {
    uint32 seq = 1;   // sequence number, echoed back in responses

    oneof body {
        // ── Control (10-19) ──
        CtrlCommand ctrl_cmd     = 10;
        CtrlResponse ctrl_resp   = 11;

        // ── File transfer (20-29) ──
        FileAnnounce file_ann   = 20;
        FileChunk    file_chunk = 21;
        FileDone     file_done  = 22;
        FileRequest  file_req   = 23;

        // ── Clipboard (30-39) ──
        ClipData clip_data = 30;

        // ── System (40-49) ──
        Heartbeat hb         = 40;
        DeviceInfo dev_info  = 41;
    }
}

// ── Control ──
message CtrlCommand {
    enum Action {
        ACTION_UNKNOWN       = 0;
        START_RECORD         = 1;
        STOP_RECORD          = 2;
        SCREENSHOT           = 3;
        RESTART_SERVER       = 4;
        SET_CLIPBOARD        = 5;
    }
    Action action = 1;
    string params = 2;   // JSON-encoded extra args
}

message CtrlResponse {
    bool   success    = 1;
    string message    = 2;
    uint32 reply_seq  = 3;  // matches WsMessage.seq
}

// ── File transfer ──
message FileAnnounce {
    string file_id   = 1;
    string file_name = 2;
    uint64 file_size = 3;
}

message FileChunk {
    string file_id = 1;
    uint64 offset  = 2;
    bytes  data    = 3;
}

message FileDone {
    string file_id = 1;
    bool   success = 2;
}

message FileRequest {
    string remote_path = 1;
}

// ── Clipboard ──
message ClipData {
    string text = 1;
}

// ── System ──
message Heartbeat {
    uint64 timestamp_ms = 1;
}

message DeviceInfo {
    string name   = 1;
    int32  width  = 2;
    int32  height = 3;
}
